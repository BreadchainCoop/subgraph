name: Subgraph CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  subgraph:
    uses: ./.github/workflows/_subgraph-cicd.yml
    with:
      subgraph-name: breadchain-subgraph
      deploy-on-main: true
      deploy-on-pr: false
      run-tests: true
      run-lint: true
      node-version: "20"
    secrets:
      GRAPH_DEPLOY_KEY: ${{ secrets.GRAPH_DEPLOY_KEY }}
